
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Debounced Search</title>
</head>
<body>
  <h1>Pencarian Pengguna</h1>

  <input
    type="search"
    id="searchInput"
    placeholder="Ketik nama pengguna..."
    autocomplete="off"
  >

  <p id="status" aria-live="polite">Mulai ketik untuk mencari.</p>
  <ul id="results"></ul>

  <script>
    const searchInput = document.getElementById("searchInput");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    let debounceTimer;
    let controller;

    async function cariPengguna(keyword) {
      if (controller) {
        controller.abort();
      }

      controller = new AbortController();

      status.textContent = "Mencari...";
      results.replaceChildren();

      try {
        const response = await fetch(
          `https://jsonplaceholder.typicode.com/users?name_like=${encodeURIComponent(keyword)}`,
          { signal: controller.signal }
        );

        if (!response.ok) {
          throw new Error("Pencarian gagal.");
        }

        const users = await response.json();

        if (users.length === 0) {
          status.textContent = "Pengguna tidak ditemukan.";
          return;
        }

        users.forEach(user => {
          const li = document.createElement("li");
          li.textContent = `${user.name} - ${user.email}`;
          results.appendChild(li);
        });

        status.textContent = `Ditemukan ${users.length} pengguna.`;
      } catch (error) {
        if (error.name === "AbortError") {
          return;
        }

        status.textContent = `Error: ${error.message}`;
      }
    }

    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);

      const keyword = searchInput.value.trim();

      if (!keyword) {
        if (controller) controller.abort();
        status.textContent = "Mulai ketik untuk mencari.";
        results.replaceChildren();
        return;
      }

      debounceTimer = setTimeout(() => {
        cariPengguna(keyword);
      }, 500);
    });
  </script>
</body>
</html>
