
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Pagination</title>
</head>
<body>
  <h1>Daftar Postingan</h1>

  <button id="prevButton" disabled>Sebelumnya</button>
  <span id="pageInfo">Halaman 1</span>
  <button id="nextButton">Berikutnya</button>

  <p id="status" aria-live="polite"></p>
  <ul id="postList"></ul>

  <script>
    const limit = 10;
    let page = 1;

    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageInfo = document.getElementById("pageInfo");
    const status = document.getElementById("status");
    const postList = document.getElementById("postList");

    async function muatHalaman() {
      prevButton.disabled = true;
      nextButton.disabled = true;
      status.textContent = "Loading...";
      postList.replaceChildren();

      try {
        const response = await fetch(
          `https://jsonplaceholder.typicode.com/posts?_page=${page}&_limit=${limit}`
        );

        if (!response.ok) {
          throw new Error("Gagal memuat postingan.");
        }

        const posts = await response.json();

        posts.forEach(post => {
          const li = document.createElement("li");
          li.textContent = `${post.title} (ID: ${post.id})`;
          postList.appendChild(li);
        });

        pageInfo.textContent = `Halaman ${page}`;
        status.textContent = `Menampilkan ${posts.length} postingan.`;

        prevButton.disabled = page === 1;
        nextButton.disabled = posts.length < limit;
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        prevButton.disabled = page === 1;
        nextButton.disabled = false;
      }
    }

    prevButton.addEventListener("click", () => {
      if (page > 1) {
        page--;
        muatHalaman();
      }
    });

    nextButton.addEventListener("click", () => {
      page++;
      muatHalaman();
    });

    muatHalaman();
  </script>
</body>
</html>
