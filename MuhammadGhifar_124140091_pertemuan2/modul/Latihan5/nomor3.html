
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Loading State</title>
</head>
<body>
  <h1>Daftar Pengguna</h1>

  <button id="loadButton">Muat Data</button>
  <p id="status" aria-live="polite">Klik tombol untuk memuat data.</p>
  <ul id="userList"></ul>

  <script>
    const button = document.getElementById("loadButton");
    const status = document.getElementById("status");
    const userList = document.getElementById("userList");

    async function muatPengguna() {
      button.disabled = true;
      status.textContent = "Loading... Mohon tunggu.";
      userList.replaceChildren();

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/users"
        );

        if (!response.ok) {
          throw new Error("Gagal mengambil data pengguna.");
        }

        const users = await response.json();

        users.forEach(user => {
          const li = document.createElement("li");
          li.textContent = `${user.name} - ${user.email}`;
          userList.appendChild(li);
        });

        status.textContent = `Berhasil memuat ${users.length} pengguna.`;
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", muatPengguna);
  </script>
</body>
</html>
