
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Async Error Handling</title>
</head>
<body>
  <h1>Async Error Handling</h1>

  <button id="successButton">Tes Berhasil</button>
  <button id="errorButton">Tes Error</button>

  <p id="status" role="status">Pilih salah satu tes.</p>
  <div id="result"></div>

  <script>
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    async function ambilData(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Permintaan gagal: HTTP ${response.status}`);
      }

      return response.json();
    }

    async function jalankanDenganPenangananError(url) {
      status.textContent = "Memproses...";
      result.replaceChildren();

      try {
        const data = await ambilData(url);

        status.textContent = "Data berhasil dimuat.";

        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(data, null, 2);
        result.appendChild(pre);
      } catch (error) {
        status.textContent = `Terjadi kesalahan: ${error.message}`;

        const retryButton = document.createElement("button");
        retryButton.textContent = "Coba Lagi";

        retryButton.addEventListener("click", () => {
          jalankanDenganPenangananError(url);
        });

        result.appendChild(retryButton);
      }
    }

    document.getElementById("successButton").addEventListener("click", () => {
      jalankanDenganPenangananError(
        "https://jsonplaceholder.typicode.com/posts/1"
      );
    });

    document.getElementById("errorButton").addEventListener("click", () => {
      jalankanDenganPenangananError(
        "https://jsonplaceholder.typicode.com/invalid-endpoint"
      );
    });
  </script>
</body>
</html>
