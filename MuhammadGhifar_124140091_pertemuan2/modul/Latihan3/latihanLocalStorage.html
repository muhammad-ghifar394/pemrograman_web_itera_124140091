
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Data Mahasiswa</title>
</head>
<body>
    <h2>Tambah Mahasiswa</h2>

    <form id="form">
        <input id="nama" placeholder="Nama" required>
        <input id="nim" placeholder="NIM" required
               pattern="[0-9]{9}">
        <input id="prodi" placeholder="Program Studi" required>
        <button type="submit">Simpan</button>
    </form>

    <h3>Daftar Mahasiswa</h3>
    <ul id="daftar"></ul>

    <script>
        const form = document.getElementById("form");
        const daftar = document.getElementById("daftar");

        let mahasiswa = JSON.parse(
            localStorage.getItem("mahasiswa")
        ) || [];

        function tampilkanMahasiswa() {
            daftar.replaceChildren();

            mahasiswa.forEach(function(m) {
                const item = document.createElement("li");
                item.textContent =
                    `${m.nama} - ${m.nim} - ${m.prodi}`;
                daftar.appendChild(item);
            });
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const data = {
                nama: document.getElementById("nama").value.trim(),
                nim: document.getElementById("nim").value.trim(),
                prodi: document.getElementById("prodi").value.trim()
            };

            if (!data.nama || !data.nim || !data.prodi) {
                return;
            }

            mahasiswa.push(data);

            localStorage.setItem(
                "mahasiswa",
                JSON.stringify(mahasiswa)
            );

            tampilkanMahasiswa();
            form.reset();
        });

        tampilkanMahasiswa();
    </script>
</body>
</html>
