
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Search Post</title>
</head>
<body>
    <h2>Daftar Post</h2>

    <input
        type="text"
        id="search"
        placeholder="Cari berdasarkan judul..."
    >

    <p id="pesan">Memuat data...</p>
    <ul id="daftar"></ul>

    <script>
        const search = document.getElementById("search");
        const daftar = document.getElementById("daftar");
        const pesan = document.getElementById("pesan");

        let posts = [];

        async function ambilPosts() {
            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/posts"
                );

                if (!response.ok) {
                    throw new Error("Gagal mengambil data");
                }

                posts = await response.json();
                tampilkanPosts();
            } catch (error) {
                pesan.textContent = error.message;
            }
        }

        function tampilkanPosts() {
            const keyword = search.value.toLowerCase();

            const hasil = posts.filter(post =>
                post.title.toLowerCase().includes(keyword)
            );

            daftar.replaceChildren();
            pesan.textContent = `Ditemukan ${hasil.length} post`;

            hasil.forEach(post => {
                const item = document.createElement("li");
                item.textContent = post.title;
                daftar.appendChild(item);
            });
        }

        search.addEventListener("input", tampilkanPosts);

        ambilPosts();
    </script>
</body>
</html>
