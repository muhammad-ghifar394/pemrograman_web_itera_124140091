
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator BMI</title>
</head>
<body>
    <h2>Kalkulator BMI</h2>

    <label>Berat badan (kg):</label>
    <input type="number" id="berat" min="0" step="any">
    <br><br>

    <label>Tinggi badan (cm):</label>
    <input type="number" id="tinggi" min="0" step="any">
    <br><br>

    <button onclick="hitungBMI()">Hitung BMI</button>

    <p id="hasil"></p>

    <script>
        function hitungBMI() {
            const berat = Number(document.getElementById("berat").value);
            const tinggi = Number(document.getElementById("tinggi").value);

            if (
                document.getElementById("berat").value === "" ||
                document.getElementById("tinggi").value === "" ||
                !Number.isFinite(berat) ||
                !Number.isFinite(tinggi) ||
                berat <= 0 ||
                tinggi <= 0
            ) {
                document.getElementById("hasil").textContent =
                    "Masukkan berat dan tinggi yang valid.";
                return;
            }

            const tinggiMeter = tinggi / 100;
            const bmi = berat / (tinggiMeter * tinggiMeter);

            let kategori;

            if (bmi < 18.5) {
                kategori = "Berat badan kurang";
            } else if (bmi < 25) {
                kategori = "Berat badan normal";
            } else if (bmi < 30) {
                kategori = "Berat badan berlebih";
            } else {
                kategori = "Obesitas";
            }

            document.getElementById("hasil").textContent =
                "BMI: " + bmi.toFixed(2) +
                " | Kategori: " + kategori;
        }
    </script>
</body>
</html>
