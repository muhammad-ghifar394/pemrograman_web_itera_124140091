
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pagination API</title>
</head>
<body>
    <h2>Daftar Post</h2>

    <p id="pesan">Memuat data...</p>
    <ul id="daftar"></ul>

    <button id="prev" disabled>Previous</button>
    <span id="halaman">Halaman 1</span>
    <button id="next" disabled>Next</button>

    <script>
        const daftar = document.getElementById("daftar");
        const pesan = document.getElementById("pesan");
        const prev = document.getElementById("prev");
        const next = document.getElementById("next");
        const labelHalaman = document.getElementById("halaman");

        const perHalaman = 10;
        let posts = [];
        let halamanSekarang = 1;

        async function ambilPosts() {
            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/posts"
                );

                if (!response.ok) {
                    throw new Error("Gagal mengambil data");
                }

                posts = await response.json();
                tampilkanHalaman();
            } catch (error) {
                pesan.textContent = error.message;
                prev.disabled = true;
                next.disabled = true;
            }
        }

        function tampilkanHalaman() {
            daftar.replaceChildren();

            const awal = (halamanSekarang - 1) * perHalaman;
            const dataHalaman = posts.slice(
                awal,
                awal + perHalaman
            );

            dataHalaman.forEach(post => {
                const item = document.createElement("li");
                item.textContent = post.title;
                daftar.appendChild(item);
            });

            const totalHalaman = Math.ceil(
                posts.length / perHalaman
            );

            pesan.textContent =
                `Menampilkan ${dataHalaman.length} post`;

            labelHalaman.textContent =
                `Halaman ${halamanSekarang} dari ${totalHalaman}`;

            prev.disabled = halamanSekarang === 1;
            next.disabled = halamanSekarang === totalHalaman;
        }

        prev.addEventListener("click", function() {
            if (halamanSekarang > 1) {
                halamanSekarang--;
                tampilkanHalaman();
            }
        });

        next.addEventListener("click", function() {
            const totalHalaman = Math.ceil(
                posts.length / perHalaman
            );

            if (halamanSekarang < totalHalaman) {
                halamanSekarang++;
                tampilkanHalaman();
            }
        });

        ambilPosts();
    </script>
</body>
</html>
