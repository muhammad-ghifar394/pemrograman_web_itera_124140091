
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Mahasiswa</title>
</head>
<body>
    <h2>Tambah Mahasiswa</h2>

    <form id="formMahasiswa">
        <label>Nama:</label>
        <input type="text" id="nama" required minlength="3">
        <br><br>

        <label>NIM:</label>
        <input type="text" id="nim" required pattern="[0-9]{9}">
        <br><br>

        <label>Program Studi:</label>
        <input type="text" id="prodi" required>
        <br><br>

        <button type="submit">Tambah Mahasiswa</button>
    </form>

    <p id="pesan"></p>
    <ul id="daftarMahasiswa"></ul>

    <script>
        const form = document.getElementById("formMahasiswa");
        const daftar = document.getElementById("daftarMahasiswa");
        const pesan = document.getElementById("pesan");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const nama = document.getElementById("nama").value.trim();
            const nim = document.getElementById("nim").value.trim();
            const prodi = document.getElementById("prodi").value.trim();

            if (!nama || !nim || !prodi) {
                pesan.textContent = "Semua kolom wajib diisi!";
                return;
            }

            const item = document.createElement("li");
            item.textContent = `${nama} - ${nim} - ${prodi}`;
            daftar.appendChild(item);

            pesan.textContent = "Mahasiswa berhasil ditambahkan!";
            form.reset();
        });
    </script>
</body>
</html>
